{% extends "base.html" %}
{% block content %}
<h1>❤️ Моё избранное</h1>
{% if favorites %}
    {% for fav in favorites %}
        <div class="track-card">
            <div><div class="track-title">{{ fav.track_title }}</div><div class="track-artist">{{ fav.track_artist }}</div></div>
            <button class="btn-icon" onclick="remFav('{{ fav.track_id }}')">❌</button>
        </div>
    {% endfor %}
{% else %}
    <div class="empty"><p>Пока пусто. Добавьте треки через поиск!</p></div>
{% endif %}
{% endblock %}
{% block scripts %}
<script>
function remFav(id) {
    fetch('/remove-from-favorites', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'track_id='+id})
    .then(r=>r.json()).then(d=>{ if(d.success) location.reload(); else alert(d.message); });
}
</script>
{% endblock %}
